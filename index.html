<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather Information System - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kai-blue: #003366;
            --kai-orange: #FF6600;
            --kai-red: #d32f2f;
        }

        body {
            background: #FF6600;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background: var(--kai-blue);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .kai-main-card {
            background: white;
            border-top: 6px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: var(--kai-blue);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        /* --- Efek Gradasi Ikon --- */
        .weather-gradient-sun {
            background: linear-gradient(to bottom right, #FFD700, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .weather-gradient-rain {
            background: linear-gradient(to bottom right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .weather-gradient-cloud {
            background: linear-gradient(to bottom right, #bdc3c7, #2c3e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .weather-gradient-storm {
            background: linear-gradient(to bottom right, #f83600, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Animasi Partikel --- */
        .particle-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .rain-drop {
            position: absolute;
            background-color: rgba(174, 194, 224, 0.4);
            width: 2px;
            height: 15px;
            top: -20px;
            animation: fall linear infinite;
        }
        .thunder-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }
        @keyframes fall { to { transform: translateY(300px); } }
        @keyframes flash {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 0.3; }
            94% { opacity: 0; }
            96% { opacity: 0.3; }
        }
        .animate-flash { animation: flash 4s infinite; }

        /* Animasi Floating */
        .weather-animate { animation: float 4s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        /* Scroll Jadwal */
        .scroll-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .scroll-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: scroll-up 40s linear infinite;
        }
        @keyframes scroll-up { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        .hourly-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
        }

        .font-header { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-center mb-4 px-2">
            <div class="font-header font-black text-2xl italic tracking-tighter text-white">
                KAI<span style="color: var(--kai-orange);">.</span>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-lg text-orange-400">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div id="particle-overlay" class="particle-container"></div>
            <div id="thunder-overlay" class="thunder-flash"></div>

            <div class="relative z-10">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-location-dot text-orange-600 animate-bounce"></i>
                    <h1 id="city-name" class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Mencari Lokasi...</h1>
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 id="current-temp" class="text-6xl font-black font-header tracking-tighter">--°</h2>
                        <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase">Memuat...</p>
                    </div>
                    <div class="flex items-center justify-center w-24 h-24">
                        <i id="main-icon" class="fas fa-spinner fa-spin text-5xl text-slate-300"></i>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100">
                    <div class="text-center">
                        <i class="fas fa-droplet text-blue-500 text-xs mb-1"></i>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Lembab</p>
                        <p id="humidity-val" class="text-sm font-black text-slate-700">--%</p>
                    </div>
                    <div class="text-center border-x border-slate-100">
                        <i class="fas fa-wind text-slate-400 text-xs mb-1"></i>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Angin</p>
                        <p id="wind-val" class="text-sm font-black text-slate-700">--</p>
                    </div>
                    <div class="text-center">
                        <i class="fas fa-mask-face text-emerald-500 text-xs mb-1"></i>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Polusi</p>
                        <p id="aqi-val" class="text-sm font-black text-slate-700">--</p>
                    </div>
                </div>
                <p id="current-date" class="text-[9px] font-bold text-slate-400 mt-4 uppercase tracking-tight text-center italic"></p>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em] flex items-center gap-2">
            <i class="fas fa-clock text-[9px]"></i> Prakiraan Per Jam
        </h3>

        <div class="scroll-wrapper">
            <div id="hourly-list" class="scroll-content"></div>
        </div>

        <div id="weather-alert" class="hidden mt-4 bg-red-600 rounded-xl p-3 border-l-4 border-orange-500 animate-pulse">
            <div class="flex items-center gap-2 mb-1">
                <i class="fas fa-triangle-exclamation text-white text-xs"></i>
                <h4 class="text-[10px] font-black uppercase text-white tracking-widest">Peringatan</h4>
            </div>
            <p id="alert-title" class="text-white font-bold text-sm leading-tight"></p>
        </div>
    </div>

    <script>
        const weatherMap = {
            0: { day: "fa-sun", night: "fa-moon", label: "Cerah", color: "weather-gradient-sun", severe: false },
            1: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Cerah Berawan", color: "weather-gradient-sun", severe: false },
            2: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Berawan", color: "weather-gradient-cloud", severe: false },
            3: { day: "fa-cloud", night: "fa-cloud", label: "Mendung", color: "weather-gradient-cloud", severe: false },
            45: { label: "Kabut", icon: "fa-smog", color: "weather-gradient-cloud", severe: false },
            61: { day: "fa-cloud-rain", night: "fa-cloud-moon-rain", label: "Hujan Ringan", color: "weather-gradient-rain", severe: false },
            63: { day: "fa-cloud-showers-heavy", night: "fa-cloud-showers-heavy", label: "Hujan Lebat", color: "weather-gradient-rain", severe: true },
            95: { day: "fa-bolt", night: "fa-bolt", label: "Badai Petir", color: "weather-gradient-storm", severe: true }
        };

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
        }
        setInterval(updateClock, 1000);

        // Efek Visual (Hujan & Petir)
        function updateEffects(code) {
            const overlay = document.getElementById('particle-overlay');
            const thunder = document.getElementById('thunder-overlay');
            overlay.innerHTML = '';
            thunder.classList.remove('animate-flash');

            if (code >= 61) { // Kode Hujan
                for (let i = 0; i < 30; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.4) + 's';
                    drop.style.animationDelay = Math.random() * 2 + 's';
                    overlay.appendChild(drop);
                }
            }
            if (code === 95) thunder.classList.add('animate-flash'); // Kode Badai
        }

        async function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherData(pos.coords.latitude, pos.coords.longitude),
                    () => fallbackToIP(),
                    { timeout: 5000 }
                );
            } else fallbackToIP();
        }

        async function fallbackToIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if(data.latitude) fetchWeatherData(data.latitude, data.longitude, true, data.city);
            } catch (e) { document.getElementById('city-name').innerText = "Lokasi Tidak Ditemukan"; }
        }

        async function fetchWeatherData(lat, lon, isIP = false, ipCity = "") {
            try {
                const [geoRes, weatherRes, airRes] = await Promise.all([
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=2`),
                    fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`)
                ]);

                const geoData = await geoRes.json();
                const weatherData = await weatherRes.json();
                const airData = await airRes.json();
                
                document.getElementById('city-name').innerText = isIP ? `Area ${ipCity} (IP)` : `Area ${geoData.city || geoData.locality || "Stasiun"}`;
                renderUI(weatherData, airData);
            } catch (e) { console.error(e); }
        }

        function renderUI(data, air) {
            const current = data.current;
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('current-temp').innerText = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('humidity-val').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerHTML = `${Math.round(current.wind_speed_10m)} <span class="text-[8px]">km/h</span>`;
            document.getElementById('aqi-val').innerText = air.current.european_aqi || "--";

            const info = weatherMap[current.weather_code] || weatherMap[0];
            const iconEl = document.getElementById('main-icon');
            const iconClass = current.is_day ? info.day : (info.night || info.icon || info.day);
            
            iconEl.className = `fas ${iconClass} text-7xl weather-animate ${info.color}`;
            document.getElementById('weather-desc-main').innerText = info.label;

            // Update Efek Partikel
            updateEffects(current.weather_code);

            // Render Hourly
            const listContainer = document.getElementById('hourly-list');
            let listHTML = '';
            const limit = 15;
            for(let i=1; i<=limit; i++) {
                const time = new Date(data.hourly.time[i]);
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const code = data.hourly.weather_code[i];
                const hInfo = weatherMap[code] || weatherMap[0];
                const h = time.getHours();
                const hIcon = (h >= 6 && h < 18) ? hInfo.day : (hInfo.night || hInfo.icon || hInfo.day);

                listHTML += `
                    <div class="hourly-item">
                        <span class="text-xs font-bold text-orange-500 w-12">${h.toString().padStart(2, '0')}.00</span>
                        <div class="flex flex-1 items-center gap-3">
                            <i class="fas ${hIcon} ${hInfo.color} text-base"></i>
                            <span class="text-xs font-semibold text-white/90">${hInfo.label}</span>
                        </div>
                        <span class="font-bold text-sm text-white">${temp}°</span>
                    </div>`;
            }
            listContainer.innerHTML = listHTML + listHTML; // Duplicate for infinite scroll effect

            // Alert
            if (info.severe) {
                document.getElementById('weather-alert').classList.remove('hidden');
                document.getElementById('alert-title').innerText = `Waspada ${info.label}. Lantai peron mungkin licin.`;
            }
        }

        initApp();
    </script>
</body>
</html>
