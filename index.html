<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather Information System - Official Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kai-blue: #003366; /* Biru Tua KAI */
            --kai-orange: #FF6600; /* Oranye KAI */
            --kai-font-main: 'Inter', sans-serif;
            --kai-font-header: 'Montserrat', sans-serif;
        }

        body {
            background: var(--kai-orange);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--kai-font-main);
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background: var(--kai-blue);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Tipografi Resmi */
        .font-kai-header { font-family: var(--kai-font-header); letter-spacing: -0.02em; }
        .font-kai-body { font-family: var(--kai-font-main); }

        .kai-main-card {
            background: white;
            border-top: 6px solid var(--kai-orange);
            border-radius: 12px;
            padding: 1.5rem;
            color: var(--kai-blue);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        /* Gradasi Ikon Vivid */
        .vivid-sun { background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(255,140,0,0.4)); }
        .vivid-cloud-sun { background: linear-gradient(135deg, #FFCE63 0%, #708090 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .vivid-cloud { background: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .vivid-rain { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(79,172,254,0.4)); }
        .vivid-storm { background: linear-gradient(135deg, #f83600 0%, #f9d423 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 12px rgba(248,54,0,0.5)); }
        .vivid-night { background: linear-gradient(135deg, #A5CCFF 0%, #4B6CB7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Partikel Hujan */
        .particle-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .rain-drop { position: absolute; background-color: rgba(174, 194, 224, 0.4); width: 2px; height: 15px; top: -20px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(350px); } }

        /* Scroll Area */
        .scroll-wrapper { 
            position: relative; 
            flex: 1; 
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            margin-bottom: 1rem;
        }
        .scroll-wrapper::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .hourly-item { 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
            padding: 0.85rem; 
            background: rgba(255, 255, 255, 0.05); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s;
        }
        .hourly-item:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-center mb-6 px-1">
            <div class="font-kai-header font-black text-3xl italic tracking-tighter text-white">
                KAI<span class="text-orange-500">.</span>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-lg text-orange-400">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div id="particle-overlay" class="particle-container"></div>
            <div class="relative z-10">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-train text-orange-600 text-xs"></i>
                    <h1 id="city-name" class="text-[11px] font-bold uppercase tracking-widest text-slate-400 font-kai-body">Menghubungkan...</h1>
                </div>
                
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 id="current-temp" class="text-6xl font-black font-kai-header">--°</h2>
                        <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase tracking-tight">Memuat Data...</p>
                    </div>
                    <div class="w-24 h-24 flex items-center justify-center">
                        <i id="main-icon" class="fas fa-spinner fa-spin text-5xl text-slate-200"></i>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4 pt-4 border-t border-slate-100">
                    <div class="text-center">
                        <p class="text-[9px] uppercase font-bold text-slate-400 mb-1">Kelembaban</p>
                        <p id="humidity-val" class="text-sm font-black text-slate-800">--%</p>
                    </div>
                    <div class="text-center border-x border-slate-100">
                        <p class="text-[9px] uppercase font-bold text-slate-400 mb-1">Angin</p>
                        <p id="wind-val" class="text-sm font-black text-slate-800">--</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] uppercase font-bold text-slate-400 mb-1">AQI</p>
                        <p id="aqi-val" class="text-sm font-black text-slate-800">--</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/40 uppercase px-1 mb-3 tracking-[0.2em] font-kai-header">
            Prakiraan Cuaca Per Jam
        </h3>

        <div class="scroll-wrapper">
            <div id="hourly-list"></div>
        </div>

        <div id="weather-alert" class="hidden rounded-lg p-4 border-l-4 shadow-2xl transition-all duration-500">
            <div class="flex items-center gap-3 mb-1">
                <i id="alert-icon" class="fas fa-circle-exclamation text-white"></i>
                <h4 id="alert-header" class="text-[11px] font-black uppercase text-white tracking-widest font-kai-header">Peringatan</h4>
            </div>
            <p id="alert-title" class="text-white text-xs font-medium leading-relaxed font-kai-body"></p>
        </div>
    </div>

    <script>
        const weatherMap = {
            0: { day: "fa-sun", night: "fa-moon", label: "Cerah", color: "vivid-sun", nightColor: "vivid-night", severe: false },
            1: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Cerah Berawan", color: "vivid-cloud-sun", nightColor: "vivid-night", severe: false },
            2: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Berawan", color: "vivid-cloud", severe: false },
            3: { day: "fa-cloud", night: "fa-cloud", label: "Mendung", color: "vivid-cloud", severe: false },
            45: { label: "Kabut", icon: "fa-smog", color: "vivid-cloud", severe: false },
            61: { day: "fa-cloud-rain", night: "fa-cloud-moon-rain", label: "Hujan Ringan", color: "vivid-rain", severe: true },
            63: { day: "fa-cloud-showers-heavy", night: "fa-cloud-showers-heavy", label: "Hujan Lebat", color: "vivid-rain", severe: true },
            95: { day: "fa-bolt", night: "fa-bolt", label: "Badai Petir", color: "vivid-storm", severe: true }
        };

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
        }
        setInterval(updateClock, 1000);

        function updateEffects(code) {
            const overlay = document.getElementById('particle-overlay');
            overlay.innerHTML = '';
            if (code >= 61) {
                for (let i = 0; i < 25; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.4) + 's';
                    overlay.appendChild(drop);
                }
            }
        }

        async function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherData(pos.coords.latitude, pos.coords.longitude),
                    () => fallbackToIP()
                );
            } else fallbackToIP();
        }

        async function fallbackToIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                fetchWeatherData(data.latitude, data.longitude, true, data.city);
            } catch (e) { document.getElementById('city-name').innerText = "Stasiun Pusat"; }
        }

        async function fetchWeatherData(lat, lon, isIP = false, ipCity = "") {
            try {
                const [geoRes, weatherRes, airRes] = await Promise.all([
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto`),
                    fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`)
                ]);
                const geoData = await geoRes.json();
                document.getElementById('city-name').innerText = isIP ? `Area ${ipCity}` : `Sekitar ${geoData.city || geoData.locality}`;
                renderUI(await weatherRes.json(), await airRes.json());
            } catch (e) { console.error(e); }
        }

        function renderUI(data, air) {
            const current = data.current;
            const hourly = data.hourly;
            
            document.getElementById('current-temp').innerText = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('humidity-val').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerText = `${Math.round(current.wind_speed_10m)} km/h`;
            document.getElementById('aqi-val').innerText = air.current.european_aqi;

            const info = weatherMap[current.weather_code] || weatherMap[0];
            const isDay = current.is_day === 1;
            document.getElementById('main-icon').className = `fas ${isDay ? (info.day || info.icon) : (info.night || info.icon)} text-7xl vivid-animate ${isDay ? info.color : info.nightColor || info.color}`;
            document.getElementById('weather-desc-main').innerText = info.label;
            updateEffects(current.weather_code);

            // LOGIKA PREDIKSI (Scan 12 Jam)
            const alertBox = document.getElementById('weather-alert');
            const alertTitle = document.getElementById('alert-title');
            const alertHeader = document.getElementById('alert-header');
            let severeWeather = null;
            let eventTime = "";

            for (let i = 1; i <= 12; i++) {
                if (weatherMap[hourly.weather_code[i]]?.severe) {
                    severeWeather = weatherMap[hourly.weather_code[i]];
                    eventTime = new Date(hourly.time[i]).getHours().toString().padStart(2, '0') + ".00";
                    break;
                }
            }

            alertBox.classList.remove('hidden');
            if (severeWeather) {
                alertBox.className = "rounded-lg p-4 border-l-4 border-orange-500 bg-red-700 shadow-xl animate-pulse";
                alertHeader.innerText = "Peringatan Cuaca";
                alertTitle.innerText = `Diprediksi ${severeWeather.label} pukul ${eventTime}. Harap berhati-hati saat mobilisasi di area stasiun.`;
            } else {
                alertBox.className = "rounded-lg p-4 border-l-4 border-emerald-400 bg-emerald-800/40 shadow-lg";
                alertHeader.innerText = "Informasi";
                alertTitle.innerText = "Kondisi cuaca hari ini diprediksi aman untuk perjalanan kereta api.";
            }

            // Render List
            let listHTML = '';
            for(let i=1; i<=12; i++) {
                const time = new Date(hourly.time[i]);
                const hInfo = weatherMap[hourly.weather_code[i]] || weatherMap[0];
                const hIsDay = time.getHours() >= 6 && time.getHours() < 18;
                listHTML += `
                    <div class="hourly-item">
                        <span class="text-xs font-bold text-orange-500 w-12 font-kai-body">${time.getHours().toString().padStart(2, '0')}.00</span>
                        <div class="flex flex-1 items-center gap-3">
                            <i class="fas ${hIsDay ? hInfo.day : hInfo.night} ${hIsDay ? hInfo.color : hInfo.nightColor} text-base"></i>
                            <span class="text-xs font-medium text-white/90 font-kai-body">${hInfo.label}</span>
                        </div>
                        <span class="font-bold text-sm text-white font-kai-header">${Math.round(hourly.temperature_2m[i])}°</span>
                    </div>`;
            }
            document.getElementById('hourly-list').innerHTML = listHTML;
        }

        initApp();
    </script>
</body>
</html>
