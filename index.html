<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather - Mitigation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --kai-blue: #003366; --kai-orange: #FF6600; --kai-red: #d32f2f; --kai-green: #2e7d32; --kai-warn: #efa900; }
        body { background: #003366; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Inter', sans-serif; margin: 0; color: white; }
        .app-container { width: 100%; max-width: 420px; height: 95vh; background: var(--kai-blue); display: flex; flex-direction: column; padding: 1.25rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .kai-main-card { background: white; border-top: 6px solid var(--kai-orange); border-radius: 1.25rem; padding: 1.25rem; color: var(--kai-blue); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 1rem; z-index: 10; position: relative; }
        .city-text { font-size: 1.15rem; line-height: 1.2; font-weight: 900; text-transform: uppercase; color: var(--kai-blue); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        #weather-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .rain-drop { position: absolute; background: rgba(0, 51, 102, 0.4); width: 2px; height: 12px; top: -20px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(300px); } }
        
        .weather-icon-giant { font-size: 4.5rem; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.1)); animation: float-and-pulse 4s ease-in-out infinite; display: inline-block; }
        @keyframes float-and-pulse { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }
        
        .scroll-content { display: flex; flex-direction: column; gap: 0.5rem; animation: scroll-up 25s linear infinite; }
        @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
        
        .hourly-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem; background: rgba(255, 255, 255, 0.08); border-radius: 0.75rem; }
        
        /* ALERT STYLES */
        .alert-box { border-left: 8px solid rgba(0,0,0,0.2); border-radius: 1.25rem; padding: 0.85rem 1rem; transition: all 0.5s ease; }
        .alert-danger { background: var(--kai-red); animation: alert-pulse 2s infinite; }
        .alert-warning { background: var(--kai-warn); color: #000 !important; }
        .alert-warning * { color: #000 !important; }
        .alert-info { background: var(--kai-green); }
        @keyframes alert-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .sync-indicator { font-size: 8px; font-weight: bold; color: rgba(255,255,255,0.4); text-transform: uppercase; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-start mb-4 px-2">
            <div>
                <div class="font-black text-2xl italic tracking-tighter leading-none" style="font-family: 'Montserrat';">KAI<span style="color: var(--kai-orange);">.</span></div>
                <div id="full-date" class="text-[10px] font-bold text-white/70 uppercase tracking-widest mt-1">-- --- ----</div>
                <div id="sync-status" class="sync-indicator">Status: Memulai...</div>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-xl text-orange-400 leading-none">00:00:00</div>
        </div>

        <div id="main-card" class="kai-main-card">
            <div id="weather-overlay"></div>
            <div class="relative z-10">
                <div class="flex items-start gap-3 mb-4">
                    <i class="fas fa-location-dot text-orange-600 text-lg mt-1"></i>
                    <div style="flex: 1; min-width: 0;">
                        <h1 id="city-name" class="city-text" style="font-family: 'Montserrat';">Lokasi...</h1>
                        <h2 id="kelurahan-name" class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mt-1 italic">Mencari GPS...</h2>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <div class="flex-1">
                        <div class="text-[9px] font-bold text-slate-400 uppercase mb-0.5 tracking-widest">Suhu Sekarang:</div>
                        <h2 id="current-temp" class="text-6xl font-black tracking-tighter leading-none" style="font-family: 'Montserrat';">--°</h2>
                        <p id="weather-desc-main" class="text-[11px] font-bold text-orange-600 uppercase mt-1">Sinkronisasi...</p>
                    </div>
                    <div class="flex-1 flex justify-center items-center">
                        <i id="main-icon" class="fas fa-spinner fa-spin text-slate-200 weather-icon-giant"></i>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-1 pt-4 border-t border-slate-100 text-center">
                    <div><p class="text-[8px] uppercase font-bold text-slate-400">Lembab</p><p id="humidity-val" class="text-xs font-black text-slate-800">--%</p></div>
                    <div class="border-x border-slate-100"><p class="text-[8px] uppercase font-bold text-slate-400">Angin</p><p id="wind-val" class="text-xs font-black text-slate-800">--</p></div>
                    <div><p class="text-[8px] uppercase font-bold text-slate-400">Arah</p><p id="wind-dir-val" class="text-xs font-black text-slate-800">--</p></div>
                </div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em]"><i class="fas fa-hourglass-half mr-1"></i> Jadwal Prakiraan Hari Ini </h3>
        
        <div style="position: relative; flex: 1; overflow: hidden; mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);">
            <div id="hourly-list" class="scroll-content"></div>
        </div>

        <div id="alert-container" class="mt-4">
            <div id="alert-box" class="alert-box alert-info text-white">
                <div class="flex items-center gap-2 border-b border-white/20 pb-2 mb-2">
                    <i id="alert-icon" class="fas fa-shield-halved text-xs"></i>
                    <h4 class="text-[9px] font-black uppercase tracking-[0.2em]">Sistem Mitigasi Cuaca</h4>
                </div>
                <h5 id="alert-title" class="text-base font-black uppercase leading-tight" style="font-family: 'Montserrat';">Memindai Prakiraan...</h5>
                <p id="alert-subtitle" class="text-[10px] font-medium mt-0.5 italic"></p>
                <p id="alert-instruction" class="text-[9px] font-bold mt-1 uppercase"></p>
            </div>
        </div>
    </div>

    <script>
        let lastLat = null, lastLon = null;

        const weatherMap = {
            0: { day: "fa-sun", label: "Cerah", color: "text-orange-400", type: 'sunny' },
            1: { day: "fa-cloud-sun", label: "Cerah Berawan", color: "text-orange-300", type: 'cloudy' },
            2: { day: "fa-cloud", label: "Berawan", color: "text-slate-400", type: 'cloudy' },
            3: { day: "fa-cloud", label: "Berawan Tebal", color: "text-slate-500", type: 'cloudy' },
            51: { day: "fa-cloud-rain", label: "Gerimis Ringan", type: 'rainy', isRain: true },
            61: { day: "fa-cloud-rain", label: "Hujan Ringan", type: 'rainy', isRain: true },
            63: { day: "fa-cloud-showers-heavy", label: "Hujan Sedang", type: 'rainy', isRain: true },
            65: { day: "fa-cloud-showers-heavy", label: "Hujan Lebat", type: 'rainy', isRain: true },
            80: { day: "fa-cloud-showers-heavy", label: "Hujan Lokal", type: 'rainy', isRain: true },
            95: { day: "fa-bolt", label: "Badai Petir", type: 'storm', isRain: true }
        };

        function updateDateTime() {
            const now = new Date();
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString('id-ID', {hour12:false}).replace(/\./g, ':');
            document.getElementById('full-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000);

        async function updateWeatherInfo(lat, lon) {
            try {
                document.getElementById('sync-status').innerText = "Status: Sinkronisasi...";
                const [weatherRes, geoRes] = await Promise.all([
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,precipitation&hourly=temperature_2m,weather_code&timezone=auto`),
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=id`)
                ]);

                const data = await weatherRes.json();
                const geo = await geoRes.json();
                
                // Lokasi
                const addr = geo.address;
                document.getElementById('city-name').innerText = addr.city || addr.town || addr.municipality || "Area Tugas";
                document.getElementById('kelurahan-name').innerText = `Sekitar Wil. ${addr.village || addr.suburb || "Area Operasional"}`;

                // Cuaca Sekarang
                const cur = data.current;
                let curCode = cur.weather_code;
                if (curCode <= 3 && cur.precipitation > 0) curCode = 80;
                const curInfo = weatherMap[curCode] || weatherMap[2];
                
                document.getElementById('current-temp').innerText = `${Math.round(cur.temperature_2m)}°`;
                document.getElementById('weather-desc-main').innerText = curInfo.label;
                document.getElementById('main-icon').className = `fas ${curInfo.day} weather-icon-giant ${curInfo.color || 'text-blue-500'}`;
                document.getElementById('humidity-val').innerText = `${cur.relative_humidity_2m}%`;
                document.getElementById('wind-val').innerText = `${Math.round(cur.wind_speed_10m)} km/j`;

                setAtmosphere(curInfo.type);

                // --- LOGIKA MITIGASI (SCANNING JAM KE DEPAN) ---
                let hourlyHTML = '';
                const now = new Date();
                const today = now.getDate();
                let rainSchedule = []; // Untuk mencatat jam berapa saja hujan

                for (let i = 0; i < data.hourly.time.length; i++) {
                    const t = new Date(data.hourly.time[i]);
                    if (t.getHours() < now.getHours() && t.getDate() === today) continue;
                    if (t.getDate() !== today) break;
                    
                    const hCode = data.hourly.weather_code[i];
                    const hInfo = weatherMap[hCode] || weatherMap[2];
                    const isRainy = hInfo.isRain || false;
                    
                    if (isRainy) {
                        rainSchedule.push(`${t.getHours().toString().padStart(2,'0')}:00`);
                    }

                    hourlyHTML += `
                        <div class="hourly-item">
                            <span class="text-xs font-bold ${isRainy ? 'text-blue-400' : 'text-orange-500'} w-10">${t.getHours().toString().padStart(2,'0')}.00</span>
                            <div class="flex flex-1 items-center gap-2">
                                <i class="fas ${hInfo.day} ${isRainy ? 'text-blue-400' : 'text-slate-400'} text-sm"></i>
                                <span class="text-[11px] font-semibold text-white/90">${hInfo.label}</span>
                            </div>
                            <span class="font-bold text-sm text-white">${Math.round(data.hourly.temperature_2m[i])}°</span>
                        </div>`;
                }
                document.getElementById('hourly-list').innerHTML = hourlyHTML + hourlyHTML;

                // --- UPDATE ALERT MITIGASI ---
                const alertBox = document.getElementById('alert-box');
                
                if (curInfo.isRain) {
                    // Kondisi 1: SEDANG HUJAN (Bahaya Langsung)
                    alertBox.className = "alert-box alert-danger text-white";
                    document.getElementById('alert-title').innerText = `⚠️ SEDANG ${curInfo.label.toUpperCase()}`;
                    document.getElementById('alert-subtitle').innerText = "Waspada rintik air & permukaan tanah licin saat ini.";
                    document.getElementById('alert-instruction').innerText = "INSTRUKSI: Gunakan APD Lengkap & Hati-hati Melangkah.";
                } else if (rainSchedule.length > 0) {
                    // Kondisi 2: AKAN HUJAN (Mitigasi)
                    alertBox.className = "alert-box alert-warning";
                    document.getElementById('alert-title').innerText = "📢 POTENSI HUJAN HARI INI";
                    document.getElementById('alert-subtitle').innerText = `Terdeteksi hujan pada pukul: ${rainSchedule.join(", ")}`;
                    document.getElementById('alert-instruction').innerText = "MITIGASI: Siapkan peralatan pelindung sebelum jam tersebut.";
                } else {
                    // Kondisi 3: AMAN (Satu Hari Cerah)
                    alertBox.className = "alert-box alert-info text-white";
                    document.getElementById('alert-title').innerText = "✅ KONDISI AMAN";
                    document.getElementById('alert-subtitle').innerText = "Tidak terdeteksi potensi hujan hingga pukul 24:00.";
                    document.getElementById('alert-instruction').innerText = "TETAP PANTAU: Lakukan pengecekan rutin setiap pergantian shift.";
                }

                document.getElementById('sync-status').innerText = `TERUPDATE: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} WIB`;
            } catch (e) {
                document.getElementById('sync-status').innerText = "Status: Gangguan Koneksi";
            }
        }

        function setAtmosphere(type) {
            const overlay = document.getElementById('weather-overlay');
            overlay.innerHTML = '';
            if (type === 'rainy' || type === 'storm') {
                for(let i=0; i<30; i++) {
                    const d = document.createElement('div'); d.className = 'rain-drop';
                    d.style.left = Math.random()*100+'%'; d.style.animationDuration = (Math.random()*0.4+0.4)+'s';
                    overlay.appendChild(d);
                }
            }
        }

        function initLocationWatch() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    lastLat = pos.coords.latitude; lastLon = pos.coords.longitude;
                    updateWeatherInfo(lastLat, lastLon);
                }, () => updateWeatherInfo(-6.12, 106.88), { enableHighAccuracy: true });

                navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    if (lastLat && (Math.abs(lat - lastLat) > 0.005 || Math.abs(lon - lastLon) > 0.005)) {
                        lastLat = lat; lastLon = lon; updateWeatherInfo(lat, lon);
                    }
                }, null, { enableHighAccuracy: true });
            }
        }

        updateDateTime(); initLocationWatch();
        setInterval(() => { if(lastLat) updateWeatherInfo(lastLat, lastLon); }, 300000); // 5 Menit
    </script>
</body>
</html>
