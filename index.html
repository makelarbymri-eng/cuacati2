<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather Information System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kai-blue: #003366;
            --kai-orange: #FF6600;
            --kai-dark-blue: #002244;
            --kai-red: #d32f2f;
        }

        body {
            background: #FF6600;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background: var(--kai-blue);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .kai-main-card {
            background: white;
            border-top: 6px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: var(--kai-blue);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            z-index: 10;
        }

        /* Animasi Icon Utama */
        .weather-animate {
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 8px 15px rgba(0, 51, 102, 0.15));
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Animasi Scroll Jadwal */
        .scroll-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            margin: 0.5rem 0;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .scroll-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: scroll-up 45s linear infinite;
        }

        @keyframes scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .hourly-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
        }

        .alert-kai-v2 {
            background: var(--kai-red);
            border-left: 8px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1rem;
            animation: pulse-alert 2s infinite;
        }

        @keyframes pulse-alert {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .font-header { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-center mb-4 px-2">
            <div class="font-header font-black text-2xl italic tracking-tighter">
                KAI<span style="color: var(--kai-orange);">.</span>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-lg opacity-90 text-orange-400">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-location-dot text-orange-600 animate-bounce"></i>
                <h1 id="city-name" class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Mencari Lokasi...</h1>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 id="current-temp" class="text-6xl font-black font-header tracking-tighter">--°</h2>
                    <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase">Memuat...</p>
                </div>
                <div class="flex items-center justify-center w-24 h-24">
                    <i id="main-icon" class="fas fa-spinner fa-spin text-5xl text-slate-300"></i>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100">
                <div class="text-center">
                    <i class="fas fa-droplet text-blue-500 text-xs mb-1"></i>
                    <p class="text-[9px] uppercase font-bold text-slate-400">Lembab</p>
                    <p id="humidity-val" class="text-sm font-black text-slate-700">--%</p>
                </div>
                <div class="text-center border-x border-slate-100">
                    <i class="fas fa-wind text-slate-400 text-xs mb-1"></i>
                    <p class="text-[9px] uppercase font-bold text-slate-400">Angin</p>
                    <p id="wind-val" class="text-sm font-black text-slate-700">--</p>
                </div>
                <div class="text-center">
                    <i class="fas fa-mask-face text-emerald-500 text-xs mb-1"></i>
                    <p class="text-[9px] uppercase font-bold text-slate-400">Polusi</p>
                    <p id="aqi-val" class="text-sm font-black text-slate-700">--</p>
                </div>
            </div>
            
            <p id="current-date" class="text-[9px] font-bold text-slate-400 mt-4 uppercase tracking-tight text-center italic"></p>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em] flex items-center gap-2">
            <i class="fas fa-clock text-[9px]"></i> Prakiraan Per Jam
        </h3>

        <div class="scroll-wrapper">
            <div id="hourly-list" class="scroll-content"></div>
        </div>

        <div id="weather-alert" class="hidden mt-4">
            <div class="alert-kai-v2">
                <div class="flex items-center gap-2 border-b border-white/20 pb-2 mb-2">
                    <i class="fas fa-triangle-exclamation text-white text-sm animate-pulse"></i>
                    <h4 class="text-[10px] font-black uppercase text-white tracking-[0.2em]">Peringatan Keselamatan</h4>
                </div>
                <div id="alert-text-container" class="text-white">
                    <h5 id="alert-title" class="text-lg font-black font-header leading-tight uppercase"></h5>
                    <p id="alert-subtitle" class="text-[11px] font-medium opacity-90 leading-tight"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const weatherMap = {
            0: { day: "fa-sun", night: "fa-moon", label: "Cerah", color: "text-orange-400", severe: false },
            1: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Cerah Berawan", color: "text-orange-200", severe: false },
            2: { day: "fa-cloud-sun", night: "fa-cloud-moon", label: "Berawan", color: "text-slate-300", severe: false },
            3: { day: "fa-cloud", night: "fa-cloud", label: "Mendung", color: "text-slate-400", severe: false },
            45: { label: "Kabut", icon: "fa-smog", color: "text-slate-200", severe: false },
            61: { day: "fa-cloud-rain", night: "fa-cloud-moon-rain", label: "Hujan Ringan", color: "text-blue-300", severe: false },
            63: { day: "fa-cloud-showers-heavy", night: "fa-cloud-showers-heavy", label: "Hujan Lebat", color: "text-yellow-500", severe: true },
            95: { day: "fa-bolt", night: "fa-bolt", label: "Badai Petir", color: "text-yellow-600", severe: true }
        };

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
        }
        setInterval(updateClock, 1000);

        // INITIALIZE APP
        async function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        fetchWeatherData(pos.coords.latitude, pos.coords.longitude);
                    },
                    async (error) => {
                        console.warn("GPS Ditolak/Error, Menggunakan Lokasi IP...");
                        fallbackToIP();
                    },
                    { timeout: 5000 }
                );
            } else {
                fallbackToIP();
            }
        }

        // FALLBACK: Ambil lokasi berdasarkan alamat IP
        async function fallbackToIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if(data.latitude) {
                    document.getElementById('city-name').innerText = `Area ${data.city} (IP Mode)`;
                    fetchWeatherData(data.latitude, data.longitude, true);
                }
            } catch (e) {
                document.getElementById('city-name').innerText = "Gagal Deteksi Lokasi";
            }
        }

        async function fetchWeatherData(lat, lon, isIP = false) {
            try {
                const [geoRes, weatherRes, airRes] = await Promise.all([
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=2`),
                    fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`)
                ]);

                const geoData = await geoRes.json();
                const weatherData = await weatherRes.json();
                const airData = await airRes.json();
                
                if (!isIP) {
                    document.getElementById('city-name').innerText = `Area ${geoData.city || geoData.locality || "Sekitar Stasiun"}`;
                }
                renderUI(weatherData, airData);
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        function renderUI(data, air) {
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('current-temp').innerText = `${Math.round(data.current.temperature_2m)}°`;
            document.getElementById('humidity-val').innerText = `${data.current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerHTML = `${Math.round(data.current.wind_speed_10m)} <span class="text-[8px]">km/h</span>`;
            document.getElementById('aqi-val').innerText = air.current.european_aqi || "--";

            const isDay = data.current.is_day === 1;
            const currentInfo = weatherMap[data.current.weather_code] || { day: "fa-cloud", night: "fa-cloud", label: "Berawan", color: "text-slate-400" };
            
            // Update Icon & Apply Animation
            const mainIcon = document.getElementById('main-icon');
            mainIcon.className = `fas ${isDay ? currentInfo.day : (currentInfo.night || currentInfo.icon)} text-7xl weather-animate ${currentInfo.color}`;
            document.getElementById('weather-desc-main').innerText = currentInfo.label;

            // Hourly List Logic
            const listContainer = document.getElementById('hourly-list');
            let listHTML = '';
            const sekarang = new Date();
            sekarang.setMinutes(0, 0, 0);

            const upcoming = data.hourly.time.map((t, idx) => ({
                time: new Date(t),
                temp: Math.round(data.hourly.temperature_2m[idx]),
                code: data.hourly.weather_code[idx]
            })).filter(item => item.time > sekarang).slice(0, 15);

            let badWeatherLog = [];

            upcoming.forEach(item => {
                const h = item.time.getHours();
                const itemIsDay = (h >= 6 && h < 18);
                const info = weatherMap[item.code] || { day: "fa-cloud", night: "fa-cloud", label: "Berawan", color: "text-white", severe: false };
                const itemIcon = itemIsDay ? (info.day || info.icon) : (info.night || info.icon);

                if (info.severe) badWeatherLog.push({ jam: `${h.toString().padStart(2, '0')}.00`, kondisi: info.label });

                listHTML += `
                    <div class="hourly-item">
                        <span class="text-xs font-bold text-orange-500 w-12">${h.toString().padStart(2, '0')}.00</span>
                        <div class="flex flex-1 items-center gap-3">
                            <i class="fas ${itemIcon} ${info.color} text-base"></i>
                            <span class="text-xs font-semibold text-white/90">${info.label}</span>
                        </div>
                        <span class="font-bold text-sm text-right w-10 text-white">${item.temp}°</span>
                    </div>`;
            });

            listContainer.innerHTML = listHTML + listHTML;

            // Alert Control
            const alertBox = document.getElementById('weather-alert');
            if (badWeatherLog.length > 0) {
                const uniqueTimes = [...new Set(badWeatherLog.map(b => b.jam))].slice(0, 2);
                alertBox.classList.remove('hidden');
                document.getElementById('alert-title').innerText = `WASPADA ${badWeatherLog[0].kondisi}`;
                document.getElementById('alert-subtitle').innerText = `Pukul ${uniqueTimes.join(' & ')}. Perhatikan langkah saat naik/turun kereta.`;
            } else {
                alertBox.classList.add('hidden');
            }
        }

        initApp();
        updateClock();
    </script>
</body>
</html>
