<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather - Dual Mode Alert System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --kai-blue: #003366; 
            --kai-orange: #FF6600; 
            --kai-red: #d32f2f;
            --kai-green: #2e7d32; /* Warna hijau KAI untuk info standar */
        }
        body { background: #FF6600; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Inter', sans-serif; margin: 0; color: white; }
        
        .app-container {
            width: 100%; max-width: 420px; height: 95vh; background: var(--kai-blue);
            display: flex; flex-direction: column; padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }

        .kai-main-card {
            background: white; border-top: 6px solid var(--kai-orange);
            border-radius: 1.25rem; padding: 1.5rem 1.25rem; color: var(--kai-blue);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); margin-bottom: 1rem;
            z-index: 10; position: relative; overflow: hidden;
        }

        .city-text {
            font-size: 1.25rem; line-height: 1.1; word-wrap: break-word;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* Weather Effects */
        #weather-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .rain-drop { position: absolute; background: rgba(0, 51, 102, 0.4); width: 2px; height: 12px; top: -20px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(300px); } }
        
        .lightning-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 3; pointer-events: none; }
        .flash-active { animation: lightning-anim 5s infinite; }
        @keyframes lightning-anim { 0%, 90%, 100% { opacity: 0; } 92% { opacity: 1; } 93% { opacity: 0; } 95% { opacity: 1; } }

        .weather-icon-giant {
            font-size: 5rem; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.1));
            animation: float-and-pulse 4s ease-in-out infinite; display: inline-block;
        }

        @keyframes float-and-pulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }

        .font-header { font-family: 'Montserrat', sans-serif; }
        .scroll-wrapper { position: relative; flex: 1; overflow: hidden; mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
        .scroll-content { display: flex; flex-direction: column; gap: 0.5rem; animation: scroll-up 45s linear infinite; }
        @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        .hourly-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem; background: rgba(255, 255, 255, 0.08); border-radius: 0.75rem; }

        /* Alert Styling - Dynamic Classes */
        .alert-box { 
            border-left: 8px solid var(--kai-orange); border-radius: 1.25rem; padding: 1rem; 
            transition: all 0.5s ease;
        }
        .alert-danger { background: var(--kai-red); animation: alert-pulse 2s infinite; }
        .alert-info { background: var(--kai-green); }

        @keyframes alert-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-start mb-4 px-2">
            <div>
                <div class="font-header font-black text-2xl italic tracking-tighter leading-none">KAI<span style="color: var(--kai-orange);">.</span></div>
                <div id="full-date" class="text-[10px] font-bold text-white/70 uppercase tracking-widest mt-1">-- --- ----</div>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-xl text-orange-400 leading-none">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div id="weather-overlay"></div>
            <div id="lightning" class="lightning-flash"></div>
            
            <div class="relative z-10">
                <div class="flex items-start gap-3 mb-4">
                    <i class="fas fa-location-dot text-orange-600 text-xl mt-1"></i>
                    <div class="flex flex-col flex-1">
                        <h1 id="city-name" class="font-black font-header uppercase tracking-tight text-slate-800 city-text">Memuat Kota...</h1>
                        <h2 id="kelurahan-name" class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mt-1">Mencari Kelurahan...</h2>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mb-6">
                    <div class="flex-1">
                        <div class="text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-widest">Kondisi Luar:</div>
                        <h2 id="current-temp" class="text-7xl font-black font-header tracking-tighter leading-none">--°</h2>
                        <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase mt-2">Sinkronisasi...</p>
                    </div>
                    
                    <div class="flex-1 flex justify-center items-center">
                        <div id="icon-container">
                            <i id="main-icon" class="fas fa-circle-notch fa-spin text-slate-200 weather-icon-giant"></i>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-5 border-t border-slate-100 text-center">
                    <div>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Lembab</p>
                        <p id="humidity-val" class="text-sm font-black text-slate-800 font-header">--%</p>
                    </div>
                    <div class="border-x border-slate-100">
                        <p class="text-[9px] uppercase font-bold text-slate-400">Kec. Angin</p>
                        <p id="wind-val" class="text-sm font-black text-slate-800 font-header">--</p>
                    </div>
                    <div>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Arah Angin</p>
                        <p id="wind-dir-val" class="text-sm font-black text-slate-800 font-header">--</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em]"><i class="fas fa-hourglass-half mr-1"></i> Prakiraan Cuaca Hari Ini</h3>
        
        <div class="scroll-wrapper">
            <div id="hourly-list" class="scroll-content"></div>
        </div>

        <div id="alert-container" class="mt-4">
            <div id="alert-box" class="alert-box alert-info">
                <div class="flex items-center gap-2 border-b border-white/20 pb-2 mb-2">
                    <i id="alert-icon" class="fas fa-circle-info text-white text-sm"></i>
                    <h4 id="alert-type-label" class="text-[10px] font-black uppercase text-white tracking-[0.2em]">Himbauan Keamanan</h4>
                </div>
                <h5 id="alert-title" class="text-lg font-black font-header leading-tight uppercase text-white"></h5>
                <p id="alert-subtitle" class="text-[11px] font-medium text-white mt-1"></p>
                <p id="alert-instruction" class="text-[10px] font-bold italic text-yellow-300 mt-2 uppercase"></p>
            </div>
        </div>
    </div>

    <script>
        const weatherMap = {
            0: { day: "fa-sun", label: "Cerah", color: "text-orange-400", type: 'sunny' },
            1: { day: "fa-cloud-sun", label: "Cerah Berawan", color: "text-orange-300", type: 'cloudy' },
            2: { day: "fa-cloud-sun", label: "Berawan", color: "text-slate-400", type: 'cloudy' },
            3: { day: "fa-cloud", label: "Berawan Tebal", color: "text-slate-500", type: 'cloudy' },
            61: { day: "fa-cloud-rain", label: "Hujan Ringan", color: "text-blue-400", type: 'rainy' },
            63: { day: "fa-cloud-showers-heavy", label: "Hujan Sedang/Lebat", color: "text-blue-600", severe: true, type: 'rainy', advice: "Gunakan payung & jas hujan. Berhati-hati saat melangkah di area stasiun." },
            95: { day: "fa-bolt", label: "Badai Petir", color: "text-yellow-600", severe: true, type: 'storm', advice: "Segera berlindung di dalam gedung stasiun. Hindari area terbuka." }
        };

        function getWindDirection(deg) {
            const arr = ["Utara", "Timur Laut", "Timur", "Tenggara", "Selatan", "Barat Daya", "Barat", "Barat Laut"];
            return arr[(Math.round(deg / 45) % 8)];
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('digital-clock').innerText = now.toLocaleTimeString('id-ID', {hour12:false}).replace(/\./g, ':');
            document.getElementById('full-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000);

        async function fetchWeatherData(lat, lon) {
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&timezone=auto&models=best_match`);
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=id`);
                const data = await weatherRes.json();
                const geo = await geoRes.json();
                const addr = geo.address;
                document.getElementById('city-name').innerText = addr.city || addr.town || addr.city_district || "Kota";
                document.getElementById('kelurahan-name').innerText = `Kel./Wil. ${addr.village || addr.suburb || addr.neighbourhood || "Area Stasiun"}`;
                renderUI(data);
            } catch (e) { console.error(e); }
        }

        function renderUI(data) {
            const current = data.current;
            document.getElementById('current-temp').innerText = `${Math.round(current.temperature_2m)}°`;
            document.getElementById('humidity-val').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerText = `${Math.round(current.wind_speed_10m)} km/j`;
            document.getElementById('wind-dir-val').innerText = getWindDirection(current.wind_direction_10m);

            const info = weatherMap[current.weather_code] || weatherMap[2];
            document.getElementById('weather-desc-main').innerText = info.label;
            document.getElementById('main-icon').className = `fas ${info.day} weather-icon-giant ${info.color}`;
            
            setAtmosphere(info.type);

            let hourlyHTML = '';
            let badWeather = null;
            const now = new Date();
            
            data.hourly.time.forEach((t, i) => {
                const time = new Date(t);
                if(time > now && time.getDate() === now.getDate()) {
                    const code = data.hourly.weather_code[i];
                    const hInfo = weatherMap[code] || weatherMap[2];
                    if(hInfo.severe && !badWeather) badWeather = { jam: time.getHours(), info: hInfo };
                    
                    hourlyHTML += `
                        <div class="hourly-item">
                            <span class="text-xs font-bold text-orange-500 w-12 font-header">${time.getHours().toString().padStart(2,'0')}.00</span>
                            <div class="flex flex-1 items-center gap-3">
                                <i class="fas ${hInfo.day} ${hInfo.color} text-base"></i>
                                <span class="text-xs font-semibold text-white/90 font-header">${hInfo.label}</span>
                            </div>
                            <span class="font-bold text-sm text-white font-header">${Math.round(data.hourly.temperature_2m[i])}°</span>
                        </div>`;
                }
            });

            document.getElementById('hourly-list').innerHTML = hourlyHTML.repeat(4);
            
            // LOGIKA DUAL MODE ALERT
            const alertBox = document.getElementById('alert-box');
            const alertTypeLabel = document.getElementById('alert-type-label');
            const alertIcon = document.getElementById('alert-icon');

            if(badWeather) {
                // Mode Cuaca Buruk (Merah)
                alertBox.className = "alert-box alert-danger";
                alertIcon.className = "fas fa-triangle-exclamation text-white text-sm";
                alertTypeLabel.innerText = "Peringatan Cuaca";
                document.getElementById('alert-title').innerText = `WASPADA ${badWeather.info.label}`;
                document.getElementById('alert-subtitle').innerText = `Diprediksi terjadi pukul ${badWeather.jam}.00 WIB.`;
                document.getElementById('alert-instruction').innerText = `HIMBAUAN: ${badWeather.info.advice}`;
            } else {
                // Mode Aman / Himbauan Standar (Hijau)
                alertBox.className = "alert-box alert-info";
                alertIcon.className = "fas fa-shield-heart text-white text-sm";
                alertTypeLabel.innerText = "Himbauan Keamanan";
                document.getElementById('alert-title').innerText = "Perjalanan Aman";
                document.getElementById('alert-subtitle').innerText = "Jagalah barang bawaan pribadi Anda agar tidak tertinggal.";
                document.getElementById('alert-instruction').innerText = "HIMBAUAN: Tetap patuhi peraturan saat naik atau turun kereta api.";
            }
        }

        function setAtmosphere(type) {
            const overlay = document.getElementById('weather-overlay');
            const lightning = document.getElementById('lightning');
            overlay.innerHTML = ''; lightning.classList.remove('flash-active');
            if (type === 'rainy' || type === 'storm') {
                for(let i=0; i<35; i++) {
                    const d = document.createElement('div'); d.className = 'rain-drop';
                    d.style.left = Math.random()*100+'%'; d.style.animationDuration = (Math.random()*0.4+0.4)+'s';
                    overlay.appendChild(d);
                }
                if(type === 'storm') lightning.classList.add('flash-active');
            }
        }

        updateDateTime();
        navigator.geolocation.getCurrentPosition(p => fetchWeatherData(p.coords.latitude, p.coords.longitude), e => fetchWeatherData(-6.2, 106.8));
    </script>
</body>
</html>
