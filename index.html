<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather Information System - BMKG Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kai-blue: #003366;
            --kai-orange: #FF6600;
            --kai-red: #d32f2f;
        }

        body {
            background: #FF6600;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: white;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background: var(--kai-blue);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .kai-main-card {
            background: white;
            border-top: 6px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: var(--kai-blue);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            z-index: 10;
            position: relative;
            overflow: hidden;
        }

        /* Weather Effects Overlay */
        #weather-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .rain-drop {
            position: absolute;
            background: rgba(0, 51, 102, 0.4);
            width: 2px; height: 12px; top: -20px;
            animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(250px); } }

        .sun-glow {
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(255, 102, 0, 0.15) 0%, transparent 70%);
            top: -50px; right: -50px;
            animation: pulse-glow 4s ease-in-out infinite;
        }
        @keyframes pulse-glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        .lightning-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            opacity: 0; z-index: 3; pointer-events: none;
        }
        .flash-active { animation: lightning-anim 4s infinite; }
        @keyframes lightning-anim {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 1; } 93% { opacity: 0; } 94% { opacity: 1; }
        }

        .font-header { font-family: 'Montserrat', sans-serif; }
        
        /* Badge Live */
        .live-badge {
            background: var(--kai-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .scroll-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .scroll-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: scroll-up 25s linear infinite;
        }
        @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        .hourly-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.85rem; background: rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
        }

        .alert-kai-v2 {
            background: var(--kai-red);
            border-left: 8px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-center mb-4 px-2">
            <div class="font-header font-black text-2xl italic tracking-tighter">
                KAI<span style="color: var(--kai-orange);">.</span>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-lg text-orange-400">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div id="weather-overlay"></div>
            <div id="lightning" class="lightning-flash"></div>

            <div class="relative z-10">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-location-dot text-orange-600"></i>
                        <h1 id="city-name" class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Mencari Lokasi...</h1>
                    </div>
                    <span class="live-badge">LIVE BMKG</span>
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase mb-1">Kondisi Saat Ini:</div>
                        <h2 id="current-temp" class="text-6xl font-black font-header tracking-tighter">--°</h2>
                        <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase">Memuat...</p>
                    </div>
                    <div class="flex flex-col items-center">
                        <i id="main-icon" class="fas fa-spinner fa-spin text-5xl text-slate-300 mb-2"></i>
                        <span id="feels-like" class="text-[9px] font-bold text-slate-400 italic">--</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100 text-center">
                    <div>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Kelembaban</p>
                        <p id="humidity-val" class="text-sm font-black text-slate-700 font-header">--%</p>
                    </div>
                    <div class="border-x border-slate-100">
                        <p class="text-[9px] uppercase font-bold text-slate-400">Kecepatan Angin</p>
                        <p id="wind-val" class="text-sm font-black text-slate-700 font-header">--</p>
                    </div>
                    <div>
                        <p class="text-[9px] uppercase font-bold text-slate-400">Indeks UV</p>
                        <p id="uv-val" class="text-sm font-black text-slate-700 font-header">--</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em]">
            <i class="fas fa-calendar-day mr-1"></i> Prediksi Sisa Hari Ini
        </h3>

        <div class="scroll-wrapper">
            <div id="hourly-list" class="scroll-content"></div>
        </div>

        <div id="weather-alert" class="hidden mt-4">
            <div class="alert-kai-v2">
                <div class="flex items-center gap-2 border-b border-white/20 pb-2 mb-2">
                    <i class="fas fa-triangle-exclamation text-white text-sm animate-pulse"></i>
                    <h4 class="text-[10px] font-black uppercase text-white tracking-[0.2em]">Peringatan BMKG</h4>
                </div>
                <h5 id="alert-title" class="text-lg font-black font-header text-white uppercase"></h5>
                <p id="alert-instruction" class="text-[10px] font-bold italic text-yellow-300 mt-2 uppercase"></p>
            </div>
        </div>
    </div>

    <script>
        // Mapping Kode Cuaca disesuaikan dengan standar BMKG
        const weatherMap = {
            0: { day: "fa-sun", label: "Cerah", color: "text-orange-400", type: 'sunny' },
            1: { day: "fa-cloud-sun", label: "Cerah Berawan", color: "text-orange-200", type: 'cloudy' },
            2: { day: "fa-cloud-sun", label: "Berawan", color: "text-slate-300", type: 'cloudy' },
            3: { day: "fa-cloud", label: "Berawan Tebal", color: "text-slate-400", type: 'cloudy' },
            45: { day: "fa-smog", label: "Udara Kabur", color: "text-slate-200", type: 'cloudy' },
            61: { day: "fa-cloud-rain", label: "Hujan Ringan", color: "text-blue-400", type: 'rainy' },
            63: { day: "fa-cloud-showers-heavy", label: "Hujan Sedang", color: "text-blue-500", severe: true, type: 'rainy', advice: "Sedia Payung/Jas Hujan. Waspada lantai peron licin." },
            95: { day: "fa-bolt", label: "Hujan Petir", color: "text-yellow-600", severe: true, type: 'storm', advice: "Waspada Petir. Segera berlindung di dalam gedung stasiun." }
        };

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
        }
        setInterval(updateClock, 1000);

        function setWeatherAtmosphere(type) {
            const overlay = document.getElementById('weather-overlay');
            const lightning = document.getElementById('lightning');
            overlay.innerHTML = '';
            lightning.classList.remove('flash-active');

            if (type === 'rainy' || type === 'storm') {
                for (let i = 0; i < 30; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (0.4 + Math.random() * 0.3) + 's';
                    drop.style.animationDelay = Math.random() * 2 + 's';
                    overlay.appendChild(drop);
                }
                if (type === 'storm') lightning.classList.add('flash-active');
            } else if (type === 'sunny') {
                const glow = document.createElement('div');
                glow.className = 'sun-glow';
                overlay.appendChild(glow);
            }
        }

        async function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeatherData(pos.coords.latitude, pos.coords.longitude),
                    err => fallbackToIP(),
                    { enableHighAccuracy: true }
                );
            } else { fallbackToIP(); }
        }

        async function fallbackToIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                fetchWeatherData(data.latitude, data.longitude, true);
            } catch (e) { document.getElementById('city-name').innerText = "Lokasi Tidak Terdeteksi"; }
        }

        async function fetchWeatherData(lat, lon, isIP = false) {
            try {
                // Menggunakan Open-Meteo dengan model BMKG (Meteo France/Germany disesuaikan koordinat Indo)
                // Ditambah parameter 'apparent_temperature' untuk "Feels Like"
                const [geoRes, weatherRes] = await Promise.all([
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,weather_code&daily=uv_index_max&timezone=auto`)
                ]);

                const geoData = await geoRes.json();
                const weatherData = await weatherRes.json();
                
                if (!isIP) {
                    // Fokus ke Kecamatan
                    document.getElementById('city-name').innerText = `Kec. ${geoData.locality || "Area Stasiun"}`;
                }
                renderUI(weatherData);
            } catch (e) { console.error(e); }
        }

        function renderUI(data) {
            const sekarang = new Date();
            const akhirHari = new Date();
            akhirHari.setHours(23, 59, 59);

            // Update UI Utama
            document.getElementById('current-temp').innerText = `${Math.round(data.current.temperature_2m)}°`;
            document.getElementById('feels-like').innerText = `Terasa: ${Math.round(data.current.apparent_temperature)}°`;
            document.getElementById('humidity-val').innerText = `${data.current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerText = `${Math.round(data.current.wind_speed_10m)} km/j`;
            document.getElementById('uv-val').innerText = data.daily.uv_index_max[0] || "0";

            const info = weatherMap[data.current.weather_code] || { day: "fa-cloud", label: "Berawan", color: "text-slate-400", type: 'cloudy' };
            const mainIcon = document.getElementById('main-icon');
            mainIcon.className = `fas ${info.day} text-5xl weather-animate ${info.color}`;
            document.getElementById('weather-desc-main').innerText = info.label;

            setWeatherAtmosphere(info.type);

            // Render List Jam
            const listContainer = document.getElementById('hourly-list');
            const alertBox = document.getElementById('weather-alert');
            let baseHTML = '';
            let badWeather = null;
            
            const todayItems = data.hourly.time.map((t, idx) => ({
                time: new Date(t),
                temp: Math.round(data.hourly.temperature_2m[idx]),
                code: data.hourly.weather_code[idx]
            })).filter(item => item.time > sekarang && item.time <= akhirHari);

            if (todayItems.length > 0) {
                todayItems.forEach(item => {
                    const h = item.time.getHours();
                    const infoItem = weatherMap[item.code] || { day: "fa-cloud", label: "Berawan", color: "text-white" };
                    
                    if (infoItem.severe && !badWeather) badWeather = { jam: `${h.toString().padStart(2, '0')}.00`, info: infoItem };

                    baseHTML += `
                        <div class="hourly-item">
                            <span class="text-xs font-bold text-orange-500 w-12 font-header">${h.toString().padStart(2, '0')}.00</span>
                            <div class="flex flex-1 items-center gap-3">
                                <i class="fas ${infoItem.day} ${infoItem.color} text-base"></i>
                                <span class="text-xs font-semibold text-white/90 font-header">${infoItem.label}</span>
                            </div>
                            <span class="font-bold text-sm text-white font-header">${item.temp}°</span>
                        </div>`;
                });

                listContainer.innerHTML = baseHTML.repeat(todayItems.length < 5 ? 8 : 2);

                if (badWeather) {
                    alertBox.classList.remove('hidden');
                    document.getElementById('alert-title').innerText = `WASPADA ${badWeather.info.label} - ${badWeather.jam}`;
                    document.getElementById('alert-instruction').innerText = `${badWeather.info.advice}`;
                } else { alertBox.classList.add('hidden'); }
            }
        }

        initApp();
        updateClock();
    </script>
</body>
</html>
