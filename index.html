<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Weather - Daily Loop Scroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kai-blue: #003366;
            --kai-orange: #FF6600;
        }

        body {
            background: #FF6600;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background: var(--kai-blue);
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .kai-main-card {
            background: white;
            border-top: 6px solid var(--kai-orange);
            border-radius: 1.25rem;
            padding: 1.25rem;
            color: var(--kai-blue);
            margin-bottom: 1rem;
            z-index: 10;
        }

        .weather-animate {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .scroll-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        .scroll-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: scroll-up 20s linear infinite;
        }

        @keyframes scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .hourly-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="flex justify-between items-center mb-4 px-2">
            <div class="font-black text-2xl italic tracking-tighter text-white">
                KAI<span style="color: var(--kai-orange);">.</span>
            </div>
            <div id="digital-clock" class="font-mono font-bold text-lg text-orange-400">00:00:00</div>
        </div>

        <div class="kai-main-card">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-location-dot text-orange-600"></i>
                <h1 id="city-name" class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Mencari Lokasi...</h1>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 id="current-temp" class="text-6xl font-black tracking-tighter">--°</h2>
                    <p id="weather-desc-main" class="text-sm font-bold text-orange-600 uppercase">Memuat...</p>
                </div>
                <div class="flex items-center justify-center w-24 h-24">
                    <i id="main-icon" class="fas fa-spinner fa-spin text-5xl text-slate-300"></i>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100 text-center">
                <div>
                    <p class="text-[9px] uppercase font-bold text-slate-400">Lembab</p>
                    <p id="humidity-val" class="text-sm font-black text-slate-700">--%</p>
                </div>
                <div class="border-x border-slate-100">
                    <p class="text-[9px] uppercase font-bold text-slate-400">Angin</p>
                    <p id="wind-val" class="text-sm font-black text-slate-700">--</p>
                </div>
                <div>
                    <p class="text-[9px] uppercase font-bold text-slate-400">AQI</p>
                    <p id="aqi-val" class="text-sm font-black text-slate-700">--</p>
                </div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-white/50 uppercase px-2 mb-2 tracking-[0.2em]">
            <i class="fas fa-clock mr-1"></i> Jadwal Cuaca Hari Ini
        </h3>

        <div class="scroll-wrapper">
            <div id="hourly-list" class="scroll-content"></div>
        </div>
    </div>

    <script>
        const weatherMap = {
            0: { day: "fa-sun", label: "Cerah", color: "text-orange-400" },
            1: { day: "fa-cloud-sun", label: "Cerah Berawan", color: "text-orange-200" },
            2: { day: "fa-cloud-sun", label: "Berawan", color: "text-slate-300" },
            3: { day: "fa-cloud", label: "Mendung", color: "text-slate-400" },
            61: { day: "fa-cloud-rain", label: "Hujan Ringan", color: "text-blue-300" },
            63: { day: "fa-cloud-showers-heavy", label: "Hujan Lebat", color: "text-yellow-500" },
            95: { day: "fa-bolt", label: "Badai Petir", color: "text-yellow-600" }
        };

        function updateClock() {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
        }
        setInterval(updateClock, 1000);

        async function initApp() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeatherData(pos.coords.latitude, pos.coords.longitude),
                    err => fallbackToIP(),
                    { enableHighAccuracy: true }
                );
            } else { fallbackToIP(); }
        }

        async function fallbackToIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                fetchWeatherData(data.latitude, data.longitude, true);
            } catch (e) { document.getElementById('city-name').innerText = "Lokasi Tidak Terdeteksi"; }
        }

        async function fetchWeatherData(lat, lon, isIP = false) {
            try {
                const [geoRes, weatherRes, airRes] = await Promise.all([
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=id`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto`),
                    fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`)
                ]);

                const geoData = await geoRes.json();
                const weatherData = await weatherRes.json();
                const airData = await airRes.json();
                
                if (!isIP) {
                    document.getElementById('city-name').innerText = `Kec. ${geoData.locality || "Area"}, ${geoData.city || ""}`;
                }
                renderUI(weatherData, airData);
            } catch (e) { console.error(e); }
        }

        function renderUI(data, air) {
            const sekarang = new Date();
            const akhirHari = new Date();
            akhirHari.setHours(23, 59, 59);

            document.getElementById('current-temp').innerText = `${Math.round(data.current.temperature_2m)}°`;
            document.getElementById('humidity-val').innerText = `${data.current.relative_humidity_2m}%`;
            document.getElementById('wind-val').innerText = `${Math.round(data.current.wind_speed_10m)} km/h`;
            document.getElementById('aqi-val').innerText = air.current.european_aqi || "--";

            const info = weatherMap[data.current.weather_code] || { day: "fa-cloud", label: "Berawan", color: "text-slate-400" };
            const mainIcon = document.getElementById('main-icon');
            mainIcon.className = `fas ${info.day} text-7xl weather-animate ${info.color}`;
            document.getElementById('weather-desc-main').innerText = info.label;

            // LOGIKA FILTER HANYA HARI INI
            const listContainer = document.getElementById('hourly-list');
            let baseHTML = '';
            
            const todayItems = data.hourly.time.map((t, idx) => ({
                time: new Date(t),
                temp: Math.round(data.hourly.temperature_2m[idx]),
                code: data.hourly.weather_code[idx]
            })).filter(item => item.time > sekarang && item.time <= akhirHari);

            // Jika sudah malam dan data tinggal sedikit, kita buat Loop dari data yang ada
            if (todayItems.length > 0) {
                todayItems.forEach(item => {
                    const h = item.time.getHours();
                    const infoItem = weatherMap[item.code] || { day: "fa-cloud", label: "Berawan", color: "text-white" };
                    baseHTML += `
                        <div class="hourly-item">
                            <span class="text-xs font-bold text-orange-500 w-12">${h.toString().padStart(2, '0')}.00</span>
                            <div class="flex flex-1 items-center gap-3">
                                <i class="fas ${infoItem.day} ${infoItem.color} text-base"></i>
                                <span class="text-xs font-semibold text-white/90">${infoItem.label}</span>
                            </div>
                            <span class="font-bold text-sm text-white">${item.temp}°</span>
                        </div>`;
                });

                // Agar scrolling tetap jalan meskipun data tinggal 1 atau 2 jam, 
                // kita lipatgandakan (repeat) HTML-nya sampai cukup panjang.
                let repeatCount = todayItems.length < 5 ? 8 : 2; 
                listContainer.innerHTML = baseHTML.repeat(repeatCount);
                listContainer.style.animation = "scroll-up 20s linear infinite";
            } else {
                // Jika tepat jam 24:00, tampilkan pesan istirahat sejenak
                listContainer.innerHTML = `<div class="py-10 text-center opacity-40 text-[10px] font-bold uppercase tracking-widest">Sistem Memperbarui Data Hari Baru...</div>`;
                listContainer.style.animation = "none";
            }
        }

        initApp();
        updateClock();
    </script>
</body>
</html>
